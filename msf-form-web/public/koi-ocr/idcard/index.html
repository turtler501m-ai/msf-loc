<!doctype html>
<html lang="ko">
  <head>
    <link type="text/css" rel="stylesheet" href="css/index.css" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  </head>

  <body>
    <div class="app" role="application" aria-label="Koiware OCR Demo">
      <div class="contents">
        <!-- Intro Section -->
        <div class="contents-section intro-section">
          <div class="guide-area">
            <!-- <div class="demo-guide">
              <p id="start-message" role="alert" tabindex="0"></p>
            </div> -->
            <!-- OCR_TYPE button section -->
            <div class="intro-section-button">
              <div id="buttonContainer" aria-live="polite"></div>
            </div>
          </div>
        </div>
        <!-- Guide Section -->
        <div class="contents-section start-section">
          <!-- OCR Guide -->
          <div class="menu-grid" role="alert" aria-live="assertive" tabindex="0">
            <div id="ID-consent" class="consent-container">
              <div class="consent-header">
                <img src="./images/noti.png" alt="알림 아이콘" />
                <h2 id="consent-title"></h2>
              </div>
              <p id="consent-description"></p>
              <ul id="consent-details-list"></ul>
              <p id="consent-notice"></p>
              <p id="consent-warning"></p>
              <br />
            </div>
          </div>
          <!-- start button -->
          <button id="start_btn" class="btn-area" aria-label="촬영 시작">
            <span id="start_btn_text"></span>
            <img src="./images/right_arrow.svg" alt="arrow icon" />
          </button>
        </div>
        <!-- File Upload Section -->
        <div class="contents-section upload-section">
          <label id="imageUpload" class="custum-file-upload" for="file">
            <div class="icon">
              <img src="./images/upload.svg" alt="upload icon" />
            </div>
            <div class="text">
              <span>Click to upload image</span>
            </div>
            <input type="file" id="file" />
          </label>

          <button id="submitBtn">
            <span id="submit_btn_text"></span>
          </button>
        </div>
        <!-- result section -->
        <div class="contents-section result-section">
          <div class="success-container">
            <div class="result-area">
              <div class="result-card">
                <div id="title_text"></div>
                <div id="imageContainer"></div>
                <div id="result_text" aria-live="polite" role="region"></div>
              </div>
            </div>
          </div>

          <div class="btn-area">
            <button id="retry_btn">
              <span id="retry_btn_text"></span>
            </button>
            <button id="back_btn">
              <span id="back_btn_text"></span>
            </button>
          </div>
        </div>

        <!-- KOI-OCR-SECTION -->
        <div class="contents-section camera-section">
          <iframe id="koiOcrFrame" src="js/ocr.html" title="OCR 모듈"></iframe>
        </div>
      </div>
    </div>

    <script src="js/lib/adapter-latest.js"></script>
    <script src="js/lib/mobile-detect.min.js"></script>
    <script type="module">
      import { APP_VERSION } from "./js/lib/version.js";
      import { loadConfig } from "./js/lib/configLoader.js";
      import { loadUtils } from "./js/lib/utilLoader.js";

      /**
       * AppState 내부로 모든 주요 객체 통합 (전역 스코프 오염 방지)
       */
      const AppState = {
        ver: APP_VERSION,
        config: null,
        utils: null,
        main: null,
        ocr: {
          ocrType: null,
          useCapOcr: null,
          changeType: null,
          regisClassType: 0,
        },
        view: {
          ocrFrame: null,
          ocrWindow: null,
        },
        buttons: {},
        ocrMsg: null,
        ocrReady: false,

        // 공통 에러 핸들러 통합
        handleError: (err) => {
          const errorMsg = err?.message || err || "알 수 없는 오류가 발생했습니다.";
          console.error("[AppState Error]:", err);
          if (AppState.main) {
            AppState.main.goToErrorPage(errorMsg);
          } else {
            alert(errorMsg);
          }
        },
      };

      function notifyHost(message) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(message, window.location.origin);
        }
      }

      function isHostedByVue() {
        return window.parent && window.parent !== window;
      }

      /**
       * 1. 초기 로드 및 설정 (DOMContentLoaded)
       */
      window.addEventListener("DOMContentLoaded", async () => {
        try {
          const [cfg, utils] = await Promise.all([loadConfig(), loadUtils()]);
          AppState.config = cfg;
          AppState.utils = utils;
          AppState.ocrMsg = cfg.MSG_EVENT;

          const mainModule = await import(`./js/ui/main/koi-views.js?v=${AppState.ver}`);
          AppState.main = mainModule;

          if (AppState.main.ready) {
            await AppState.main.ready;
          }

          registerButtons();
          await AppState.main.textElements();

          // 초기 뷰 설정
          await AppState.main.changeContentViewStack("intro", AppState.ocr.ocrType);
          AppState.utils.preventBackNavigation();
        } catch (err) {
          AppState.handleError(err);
        }
      });

      /**
       * 2. Window Load 시점에 모듈 초기화
       */
      window.addEventListener("load", async () => {
        try {
          // [개선] Promise 기반으로 iframe 생성이 완료될 때까지 기다림
          await resetOcrModule();
          document.querySelector("body").classList.add("loaded");
        } catch (err) {
          AppState.handleError(err);
        }
      });

      /**
       * 3. iframe(ocr.html) 통신 제어
       */
      window.addEventListener("message", function (event) {
        if (!event.data || !event.data.type || !AppState.ocrMsg) return;

        const { type, result, error } = event.data;

        if (type === "OCR_CAPTURED") {
          notifyHost({ type: "OCR_CAPTURED", result });
          return;
        }

        switch (type) {
          case AppState.ocrMsg.READY:
            console.log("OCR iframe 시스템 준비 완료");
            AppState.ocrReady = true;
            notifyHost({ type: "OCR_READY" });
            break;

          case AppState.ocrMsg.READY_OCR:
            const captureCfg = AppState.config.viewStack[AppState.ocr.useCapOcr];
            if (captureCfg?.runCamera) {
              AppState.view.ocrWindow.postMessage(
                { type: AppState.ocrMsg.START_CAMERA },
                "*"
              );
            }
            break;

          case AppState.ocrMsg.RESULT:
            handleOcrResult(result);
            AppState.utils.hideLoading(".upload-section");
            break;

          case AppState.ocrMsg.ERROR:
            if (error === "TIMEOUT") {
              notifyHost({
                type: "OCR_TIMEOUT",
                error,
              });

              if (isHostedByVue()) return;

              AppState.handleError("OCR 스캔 시간이 만료되었습니다.");
              break;
            }

            notifyHost({
              type: "OCR_ERROR",
              error,
            });

            if (isHostedByVue()) return;

            AppState.handleError(error || "OCR 처리 중 오류가 발생했습니다.");
            break;
        }
      });

      window.addEventListener("message", async function (event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== "START_OCR") return;

        const { ocrType, useCapOcr } = event.data.payload || {};
        await startOcr(ocrType, useCapOcr);
      });

      /**
       * 4. OCR 모듈 생명주기 관리 (Promise 기반)
       */
      function removeOcrFrame() {
        const iframe = document.getElementById("koiOcrFrame");
        if (iframe) {
          iframe.src = "about:blank";
          iframe.remove();
          AppState.view.ocrFrame = null;
          AppState.view.ocrWindow = null;
        }
      }

      function resetOcrModule() {
        return new Promise((resolve) => {
          removeOcrFrame();

          // setTimeout 대신 요소 생성 후 즉시 DOM 트리에서 감지하도록 처리
          const container = document.querySelector(".camera-section");
          if (!container) return resolve();

          const newFrame = document.createElement("iframe");
          newFrame.id = "koiOcrFrame";
          newFrame.src = "js/ocr.html";
          newFrame.title = "OCR 모듈";

          // iframe 로드가 완료된 시점에 할당 및 resolve (Race Condition 방지)
          newFrame.onload = () => {
            AppState.view.ocrFrame = newFrame;
            AppState.view.ocrWindow = newFrame.contentWindow;
            console.log("OCR 프레임 로드 및 할당 완료");
            resolve();
          };

          container.appendChild(newFrame);
        });
      }

      /**
       * 5. 버튼 등록 및 이벤트 핸들링
       */
      function registerButtons() {
        const mainContainer = AppState.utils.getElement("#buttonContainer");
        let isFirstButton = true;

        AppState.config.CATEGORY_MAP.forEach((category) => {
          const titleEl = document.createElement("h3");
          titleEl.className = "category-title";
          titleEl.innerText = category.title;
          mainContainer.appendChild(titleEl);

          const groupWrapper = document.createElement("div");
          groupWrapper.className = "category-group";
          mainContainer.appendChild(groupWrapper);

          category.ids.forEach((targetId) => {
            const btnData = AppState.config.buttonsData.find((item) => item.id === targetId);
            if (btnData) {
              const button = AppState.main.createButton(btnData);
              if (button) {
                groupWrapper.appendChild(button);
                if (isFirstButton) {
                  AppState.buttons.first = button;
                  isFirstButton = false;
                }
                button.addEventListener("click", () => handleStartButton(btnData.id));
              }
            }
          });
        });

        // 공통 버튼 할당
        AppState.buttons = {
          ...AppState.buttons,
          start: AppState.utils.addClickListener("#start_btn", () => startOcr(AppState.ocr.ocrType)),
          retry: AppState.utils.addClickListener("#retry_btn", handleRetryButton),
          back: AppState.utils.addClickListener("#back_btn", () => AppState.main.handleBackButton(AppState.ocr.ocrType)),
          submit: AppState.utils.addClickListener("#submitBtn", handleSubmitButton),
        };

        AppState.utils.getElement("#imageUpload").addEventListener("change", AppState.main.handleFileInput);
      }

      /**
       * 6. 비즈니스 로직 함수군
       */
      async function startOcr(ocrType, useCapOcrParam) {
        try {
          if (!AppState.view.ocrWindow) throw new Error("OCR 프레임이 준비되지 않았습니다.");

          const typeSpecificOptions = AppState.config.koiOptions[ocrType] || {};
          const resolvedUseCapOcr = AppState.main.resolveUseCapOcr(ocrType, useCapOcrParam);
          const options = AppState.main.createKoiOcrOptions(AppState.config.koiOptions.default, typeSpecificOptions, resolvedUseCapOcr);

          options.ocrType = ocrType;
          const regisVal = AppState.main.updateRegisClass();
          if (regisVal !== null) options.cameraOptions.regisClassType = regisVal;

          AppState.ocr.ocrType = ocrType;
          AppState.ocr.useCapOcr = resolvedUseCapOcr;

          manageCameraView(resolvedUseCapOcr);
          AppState.view.ocrWindow.postMessage({ type: AppState.ocrMsg.START_OCR, options }, "*");
        } catch (err) {
          AppState.handleError(err);
        }
      }

      function manageCameraView(useCapOcr) {
        const viewCfg = AppState.config.viewStack[useCapOcr]; // OCR 타입별 UI 구성 정의

        if (!viewCfg) return;
        const cfg = {
          ...viewCfg,
          switch: viewCfg.switch,
        };

        // UI 영역 전환
        if (cfg.view) AppState.main.changeContentViewStack(cfg.view, AppState.ocr.ocrType);
      }

      async function handleStartButton(buttonId) {
        const ocrType = AppState.utils.getOcrTypeFromButtonId(buttonId);
        AppState.ocr.ocrType = ocrType;
        await startOcr(ocrType);
      }

      async function handleOcrResult(resultData) {
        try {
          AppState.ocr.changeType =
            resultData.type || AppState.ocr.ocrType;

          AppState.view.ocrWindow.postMessage(
            { type: AppState.ocrMsg.STOP_CAMERA },
            "*"
          );

          notifyHost({type: "OCR_RESULT", result: resultData});

          if (isHostedByVue()) return;

          AppState.main.handleResultScreen(
            resultData,
            AppState.ocr.changeType,
            AppState.ocr.useCapOcr,
          );
        } catch (err) {
          AppState.handleError(err);
        }
      }

      async function handleRetryButton() {
        AppState.utils.scrollTop();
        await startOcr(AppState.ocr.ocrType);
      }

      async function handleSubmitButton() {
        const imgElement = document.querySelector("#srcFile-upload");
        if (imgElement) {
          const imageData = await AppState.main.getImageDataFromBase64(imgElement);
			console.log("imageData", imageData);
          if (imageData) {
            AppState.utils.showLoading(".upload-section");
            AppState.view.ocrWindow.postMessage({ type: AppState.ocrMsg.FILE_UPLOAD, imageData, ocrType: AppState.ocr.ocrType }, "*");
            AppState.utils.hideLoading(".upload-section");
          }
        }
      }

      async function handleCaptureButton() {
        AppState.view.ocrWindow.postMessage({ type: AppState.ocrMsg.START_CAMERA }, "*");
        AppState.utils.hide("cap_btn");
      }

      async function handleSwitchButton() {
        AppState.ocr.useCapOcr = AppState.config.rtcType.MANUAL;
        await startOcr(AppState.ocr.ocrType, AppState.ocr.useCapOcr);
        await waitForReadyOcr();
        AppState.view.ocrWindow.postMessage({ type: AppState.ocrMsg.START_CAMERA }, "*");
      }

      function waitForReadyOcr() {
        return new Promise((resolve) => {
          function onMessage(event) {
            if (event.data?.type === AppState.ocrMsg.READY_OCR) {
              window.removeEventListener("message", onMessage);
              resolve();
            }
          }
          window.addEventListener("message", onMessage);
        });
      }
    </script>
  </body>
</html>
