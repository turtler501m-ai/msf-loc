#### Common Profile

## Server - Servlet Container
server:
  port: 8080
  tomcat:
    connection-timeout: 2800
    keep-alive-timeout: -1
    max-keep-alive-requests: -1
    threads:
      max: 200
      min-spare: 200
  accept-count: 100
  shutdown: graceful
  forward-headers-strategy: framework



## Spring
spring:
  ## Security
  security:
    authorization:
      permit-all-urls:
        - /api/n/**
        - /actuator/**
      token-ignore-urls:
        - /api/n/**
        - /actuator/**
    jwt:
      secret-key:  ## 환경별 설정
      issuer: kt-Mmobile-SmartForm
      allowed-user-types:
        - USER

  ## Request Log
  request-log:
    exclude-url-patterns:
      - /favicon.ico
      - /actuator/**

    enabled:
      request-headers: true
      response-headers: true
      request-body: true
      response-body: true
    response-body-content-types:
      - application/json
    max-body-length: 1000

    ## 헤더 로깅 공통 룰 확장
    header-names:
      additional-include:
        request-log:
          - Content-Length

    ## 바디(JSON, form-urlencoded, form-data) 필드 축약 공통 룰 확장
    body-truncated-fields:
      additional-include:
        request-log: []

  ## Body Cache
  body-cache:
    request:
      ## RequestLogFilter/AccessTraceFilter가 요청 본문을 재사용하기 위해 캐시할 최대 바이트 수
      ## 너무 작으면 긴 JSON이 잘려 필드별 마스킹/축약 전에 JSON 파싱이 실패할 수 있음
      limit: 524288
    response:
      ## RequestLogFilter/AccessTraceFilter가 응답 본문을 로깅/이력 저장하기 위해 캐시할 최대 바이트 수
      limit: 524288

  ## Servlet Multipart Handling
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  ## Binding
  binding:
    string-trim: true
    string-empty-as-null: false



## 외부 서비스 인증 (Inbound)
external-service-auth:
  api-key-header-name: X-Service-Api-Key
  services:
    eformsign: ## eFormSign
      user-name: eFormSign
      api-key:                 ## 각 환경별 설정
      allowed-ip-addresses: [] ## 각 환경별 설정
    koi-idcard: ## KOI 모바일신분증 인증
      user-name: KOI-IDCARD
      api-key:                 ## 각 환경별 설정
      allowed-ip-addresses: [] ## 각 환경별 설정



## Actuator
management:
  server:
    port: ${server.port}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.9, 0.95, 0.99
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:}}
  otlp:
    metrics:
      export:
        enabled: false
