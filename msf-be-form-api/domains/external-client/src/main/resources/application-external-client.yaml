#### Common Profile
spring:
  http:
    ## 연동 대상 서비스
    ## internal-service, external-service 프로퍼티를 참조하도록 작성 (직접 작성 지양)
    serviceclient:
      ## 내부 서비스
      form-api:
        base-url: ${internal-service.services.form-api.base-url}
        connect-timeout: 1s
        read-timeout: 2s
      admin-api:
        base-url: ${internal-service.services.admin-api.base-url}
        connect-timeout: 1s
        read-timeout: 2s
      batch:
        base-url: ${internal-service.services.batch.base-url}
        connect-timeout: 1s
        read-timeout: 2s
      koi-ocr:
        base-url: ${internal-service.services.koi-ocr.base-url}
        connect-timeout: 2s
        read-timeout: 3s
      koi-idcard:
        base-url: ${internal-service.services.koi-idcard.base-url}
        connect-timeout: 2s
        read-timeout: 3s
      eformsign:
        base-url: ${internal-service.services.eformsign.base-url}
        connect-timeout: 2s
        read-timeout: 3s

      ## 외부 서비스
      msp-prx:
        base-url: ${external-service.services.msp-prx.base-url}
        connect-timeout: 5s
        read-timeout: 30s
      nice-api:
        base-url: ${external-service.services.nice-api.base-url}
        connect-timeout: 2s
        read-timeout: 10s
      image-system:
        base-url: ${external-service.services.image-system.base-url}
        connect-timeout: 5s
        read-timeout: 60s
      juso:
        base-url: ${external-service.services.juso.base-url}
        connect-timeout: 2s
        read-timeout: 5s



## HTTP Client
http-client:
  proxy:
    enabled: true
    host:  ## 각 환경별 설정
    port:  ## 각 환경별 설정
    groups:
      - nice-api
      - juso

  recording:
    ## 헤더 로깅
    ## 헤더명 뒤에 [size] 또는 [start:end] 지정 가능 (생략 시 값 전체 로깅)
    header-names:
      ## 확장 항목: 여러 YAML에서 확장할 때는 custom-group 이름 대신 적절한 이름을 지정하여 추가
      additional-include:
        eformsign: ## eFormSign
          - eformsignSignature[10]
      additional-exclude:
        custom-group: []

    ## 바디(JSON, form-urlencoded, form-data) 필드 마스킹
    body-masked-fields:
      ## 확장 항목: 여러 YAML에서 확장할 때는 custom-group 이름 대신 적절한 이름을 지정하여 추가
      additional-include:
        juso:
          - confmKey  # 주소 검색 API Key
        nice-api:
          - svcPwd        # NICE 계좌 실명확인 비밀번호
          - strResId      # 주민번호/사업자번호/법인번호
          - strAccountNo  # 계좌번호
      additional-exclude:
        custom-group: []

    ## 바디(JSON, form-urlencoded, form-data) 필드 축약
    ## 필드명 뒤에 [size] 또는 [start:end] 지정 가능 (생략 시 기본값 사용)
    body-truncated-fields:
      ## 확장 항목: 여러 YAML에서 확장할 때는 custom-group 이름 대신 적절한 이름을 지정하여 추가
      additional-include:
        eformsign: ## eFormSign
          - documentComponentList.value[100:]  # 서명 컴포넌트 데이터 값
        koi-ocr: ## KOI-OCR
          - fieldResults.value[2:] # 신분증 인증 응답 필드 값
          - photoImage[10:]        # 신분증 인증 응답 Base64 이미지
          - cropImage[10:]         # 신분증 인증 응답 Base64 이미지
          - maskImage[10:]         # 신분증 인증 응답 Base64 이미지
      additional-exclude:
        custom-group: []



## 내부 서비스 (Outbound)
## (연동하는 모든 내부 서비스 정보를 여기에서 관리)
internal-service:
  services:
    form-api: ## FORM-API
      base-url: http://tasks.msf-form-api:8080
    admin-api: ## ADMIN-API
      base-url: http://tasks.msf-admin-api:8080
    batch: ## BATCH
      base-url: http://tasks.msf-batch:8080
    koi-ocr: ## KOI OCR 인식
      base-url: http://tasks.solution-koi-ocr:8080
    koi-idcard: ## KOI 모바일신분증 인증
      base-url: http://tasks.solution-koi-idcard:8080
    eformsign: ## eFormSign
      base-url:      ## 각 환경별 설정
      properties:
        member-id:   ## 각 환경별 설정
        api-key:     ## 각 환경별 설정
        private-key: ## 각 환경별 설정



## 외부 서비스 (Outbound)
## (연동하는 모든 외부 서비스 정보를 여기에서 관리)
external-service:
  services: ## 환경별 설정
    msp-prx: ## MSP PRX
      base-url: https://none
    nice-api: ## NICE API (계좌 실명확인)
      base-url: https://secure.nuguya.com
      properties:
        nice-uid: Nktisc
        svc-pwd:  ## 각 환경별 설정
    image-system: ## 이미지 시스템
      base-url: https://none
    juso: ## 주소 검색
      base-url: https://business.juso.go.kr
      properties:
        api-key:       ## 각 환경별 설정
        coord-api-key: ## 각 환경별 설정
